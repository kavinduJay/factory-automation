<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TF01 Factory Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm" class="panel" autocomplete="on">
    <div class="brand"><b>TF01</b><span>Factory monitor</span></div>
    <label class="f">Username<input type="text" id="lu" name="username" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="lp" name="password" autocomplete="current-password" required></label>
    <button class="btn">Log in</button>
    <p class="err" id="loginErr" aria-live="polite"></p>
  </form>
</div>
<div class="app" id="app" hidden>
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
